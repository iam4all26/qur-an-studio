name: quran_studio
description: Offline Qur'an recitation video maker.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  kainuwa_encoder:
    path: packages/kainuwa_encoder
  photo_manager: ^3.6.4
  # Kept below the versions that need xml 7, which blocks the launcher icon tool.
  flutter_svg: ">=2.0.10+1 <2.1.0"
  vector_graphics: ">=1.1.11+1 <1.2.0"
  vector_graphics_compiler: ">=1.1.9+1 <1.2.0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/backgrounds/
    - assets/icons/
    - assets/icons_svg/
    - assets/illustrations/
    - assets/hands/
    - assets/brands/social/
    - assets/brands/dev/
    - assets/brands/lang/
    - assets/brands/crypto/
    - assets/brands/apps/
    - assets/brands/pay/
  fonts:
    - family: Andika
      fonts:
        - asset: assets/fonts/andika_r.ttf
        - asset: assets/fonts/andika_b.ttf
          weight: 700
    - family: Anton
      fonts:
        - asset: assets/fonts/anton_r.ttf
