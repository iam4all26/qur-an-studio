name: quran_studio
description: Offline Qur'an recitation video maker.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  kainuwa_encoder:
    path: packages/kainuwa_encoder
  photo_manager: ^3.6.4
  sqflite: ">=2.3.3 <2.5.0"
  crypto: ">=3.0.3 <4.0.0"
  url_launcher: ">=6.3.0 <7.0.0"
  package_info_plus: ">=8.0.0 <9.0.0"
  # Kept below the versions that need xml 7, which blocks the launcher icon tool.
  flutter_svg: ">=2.0.10+1 <2.1.0"
  vector_graphics: ">=1.1.11+1 <1.2.0"
  vector_graphics_compiler: ">=1.1.9+1 <1.2.0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/templates/
    - assets/templates/bg/
    - assets/outro/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_r.otf
        - asset: assets/fonts/inter_b.otf
          weight: 700
